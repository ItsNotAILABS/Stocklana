[package]
name = "stocklana-market"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stocklana_market"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
solana-program = "2.2"
borsh = { version = "1.5", features = ["derive"] }
spl-token = { version = "7", features = ["no-entrypoint"] }
thiserror = "2"
